name: Release

# On a version tag (v1.0.0), builds and tests the installers with the Packages workflow and drafts
# a GitHub release with them attached and the tag's CHANGELOG.md section as its notes (issue #124).
# Publishing the draft is a person's step.
on:
  push:
    tags: ["v*"]

jobs:
  notes:
    name: Check the version and changelog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release notes
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME"

  packages:
    needs: notes
    uses: ./.github/workflows/package.yml

  release:
    name: Draft the GitHub release
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" packages/* --draft --verify-tag \
            --title "Mesh2Cad ${GITHUB_REF_NAME#v}" --notes-file notes.md
