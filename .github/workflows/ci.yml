name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the full suite on every preset plus a long fuzzing run under the sanitizers.
  # The golden scans are not in the repository, so the golden test reports them as skipped
  # here; run `ctest -L golden` on a machine with the scans before each gate
  # (tests/golden/README.md).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_iterations:
        description: Mutated inputs for the long fuzzing run
        default: "1000000" # about 15 minutes under the sanitizers

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: "1"
  # Binary cache for vcpkg packages, restored by actions/cache below.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  checks:
    name: Format and layering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: clang-format
        run: find src tests \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 clang-format-18 --dry-run -Werror
      - name: Layering
        run: python3 scripts/check_layers.py

  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: linux-gcc-release }
          - { os: ubuntu-24.04, preset: linux-gcc-sanitize }
          - { os: windows-2022, preset: windows-msvc-release }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      # vcpkg builds gmp and mpfr (CGAL dependencies) with autotools from the system, and Open
      # CASCADE's visualisation toolkits against the system OpenGL and X11 headers.
      - name: Install Ninja, autotools, OpenGL and X11 headers (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build autoconf autoconf-archive
          automake libtool libgl1-mesa-dev libx11-dev libxext-dev

      - name: Set up the MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The baseline commit in vcpkg.json must exist in the clone, so use a full clone
      # instead of the (possibly outdated) copy preinstalled on the runner.
      - name: Get vcpkg
        shell: bash
        run: |
          mkdir -p .vcpkg-cache
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # A new seed each night; a failure prints the seed, and the rerun below saves the input.
      - name: Long fuzzing run (nightly)
        id: fuzz
        if: matrix.preset == 'linux-gcc-sanitize' && github.event_name != 'push' && github.event_name != 'pull_request'
        run: >-
          build/linux-gcc-sanitize/tests/fuzz/m2c_fuzz_mesh_parsers
          --iterations ${{ inputs.fuzz_iterations || '1000000' }} --seed ${{ github.run_number }}
      - name: Save the failing fuzz input
        if: failure() && steps.fuzz.outcome == 'failure'
        run: >-
          build/linux-gcc-sanitize/tests/fuzz/m2c_fuzz_mesh_parsers
          --iterations ${{ inputs.fuzz_iterations || '1000000' }} --seed ${{ github.run_number }}
          --save-last fuzz-failing-input.bin || true
      - uses: actions/upload-artifact@v4
        if: failure() && steps.fuzz.outcome == 'failure'
        with:
          name: fuzz-failing-input
          path: fuzz-failing-input.bin

  app:
    name: Desktop app (Linux, Qt from apt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt, CGAL, Eigen, Open CASCADE, OpenSubdiv and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev libcgal-dev libeigen3-dev \
            libocct-data-exchange-dev libtbb-dev libosd-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMESH2CAD_WARNINGS_AS_ERRORS=ON -DMESH2CAD_BUILD_APP=ON
      - name: Build
        run: cmake --build build
      - name: Test (the app tests open a window on Xvfb)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" ctest --test-dir build --output-on-failure
